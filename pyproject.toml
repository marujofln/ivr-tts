[project]
name = "ivr-tts"
version = "0.1.6"
description = "Outbound voice-message dialer for FreeSWITCH: imports contacts from CSV, dials them and plays a TTS message."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi-cli>=0.0.7",
    "fastapi[all]>=0.115.12",
    "fief-client>=0.20.0",
    "greenswitch>=0.0.19",
    "makefun>=1.16.0",
    "pandas>=2.2.3",
    "phonenumbers>=9.0.5",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
    "sqlalchemy>=2.0.41",
    "ssml-builder>=1.1.1",
    "xmltodict>=0.14.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
